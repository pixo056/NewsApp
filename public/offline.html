<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4d19cc" />
    <title>Пульс — нет связи</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f2fb;
        color: #2a1468;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 390px;
        padding: 35px;
        text-align: center;
      }
      img {
        width: 64px;
        margin: auto;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -1px;
      }
      p {
        font-size: 15px;
        line-height: 1.8;
        color: #75678a;
      }
      button {
        background: #4d19cc;
        color: white;
        border: 0;
        padding: 14px 23px;
        border-radius: 10px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Пульс" />
      <h1>Кампус немного подождёт</h1>
      <p>
        Связь с локальным сервером потеряна. Проверьте, что приложение запущено, и попробуйте
        подключиться снова.
      </p>
      <button onclick="location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
